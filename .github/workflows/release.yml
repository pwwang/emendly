name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin_name: emendly-engine.exe
            artifact_name: engine-win-x64
          - os: ubuntu-latest
            bin_name: emendly-engine
            artifact_name: engine-linux-x64
          - os: macos-latest
            bin_name: emendly-engine
            artifact_name: engine-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build engine (release)
        run: cargo build --manifest-path engine/Cargo.toml --release --locked

      - name: Stage engine binary and prompt templates
        shell: bash
        run: |
          mkdir -p dist-engine/actions
          cp "engine/target/release/${{ matrix.bin_name }}" "dist-engine/${{ matrix.bin_name }}"
          cp engine/actions/*.toml dist-engine/actions/

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-engine/
          if-no-files-found: error

  shell:
    name: Windows Shell
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Strip leading v from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$version"

      - name: Publish Windows shell
        shell: pwsh
        run: |
          dotnet publish shell/windows/Emendly.App/Emendly.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -o publish-shell

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-win-x64
          path: publish-shell/
          if-no-files-found: error

  package:
    name: Package Windows Release
    needs:
      - engine
      - shell
    runs-on: windows-latest
    steps:
      - name: Download Windows shell
        uses: actions/download-artifact@v4
        with:
          name: shell-win-x64
          path: stage/Emendly

      - name: Download Windows engine
        uses: actions/download-artifact@v4
        with:
          name: engine-win-x64
          path: stage/Emendly/engine

      # The engine resolves templates from <exe dir>/../actions as well as
      # <exe dir>/actions; keep them beside the binary for a portable layout.
      - name: Ensure prompt templates sit beside the engine
        shell: pwsh
        run: |
          $src = "stage/Emendly/engine/actions"
          if (-not (Test-Path $src)) {
            throw "Engine artifact is missing its actions/ directory"
          }
          $count = (Get-ChildItem $src -Filter *.toml | Measure-Object).Count
          if ($count -lt 9) {
            throw "Expected 9 prompt templates, found $count"
          }
          Write-Host "Prompt templates: $count"

      - name: Sign staged Windows binaries
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $targets = @(
            "stage/Emendly/Emendly.App.exe",
            "stage/Emendly/engine/emendly-engine.exe"
          )

          $hasAzure = -not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ENDPOINT) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ACCOUNT) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_PROFILE)
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_B64) `
            -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)

          if (-not $hasAzure -and -not $hasPfx) {
            Write-Host "::notice::No Windows code-signing secrets configured; shipping unsigned binaries."
            exit 0
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found in Windows Kits"
          }

          if ($hasAzure) {
            $toolsDir = Join-Path $env:RUNNER_TEMP "trusted-signing-client"
            $dlib = Get-ChildItem $toolsDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $dlib) {
              New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
              $nupkg = Join-Path $toolsDir "client.zip"
              Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile $nupkg
              Expand-Archive -Path $nupkg -DestinationPath $toolsDir -Force
              $dlib = Get-ChildItem $toolsDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
                Where-Object { $_.FullName -match 'x64' } |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $dlib) {
              throw "Azure.CodeSigning.Dlib.dll not found in Microsoft.Trusted.Signing.Client package"
            }

            $metadataPath = Join-Path $env:RUNNER_TEMP "azure-signing-metadata.json"
            $metadata = @{
              Endpoint = $env:AZURE_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
              CertificateProfileName = $env:AZURE_SIGNING_PROFILE
            } | ConvertTo-Json
            Set-Content -Path $metadataPath -Value $metadata -Encoding UTF8

            try {
              foreach ($target in $targets) {
                & $signtool sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib /dmdf $metadataPath $target
                if ($LASTEXITCODE -ne 0) {
                  throw "Azure Artifact Signing failed for $target (exit $LASTEXITCODE)"
                }
              }
            }
            finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $metadataPath
            }
          }
          else {
            $pfxPath = Join-Path $env:RUNNER_TEMP "emendly-sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_B64))
            try {
              foreach ($target in $targets) {
                & $signtool sign /v /f $pfxPath /p $env:WINDOWS_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
                if ($LASTEXITCODE -ne 0) {
                  throw "PFX code signing failed for $target (exit $LASTEXITCODE)"
                }
              }
            }
            finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
            }
          }

      - name: Verify bundle layout and create zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $required = @(
            "stage/Emendly/Emendly.App.exe",
            "stage/Emendly/engine/emendly-engine.exe",
            "stage/Emendly/engine/actions/proofread.toml",
            "stage/Emendly/engine/actions/rewrite.toml",
            "stage/Emendly/engine/actions/compose.toml",
            "stage/Emendly/engine/actions/translate.toml",
            "stage/Emendly/Assets/emendly.ico",
            "stage/Emendly/appsettings.json",
            "stage/Emendly/app-rules.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required bundle file: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/Emendly" -DestinationPath "dist/Emendly-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $iss = @"
          [Setup]
          AppId={{8D6B4A7E-5F2C-4C19-9A3B-2E7F4B1C9D08}
          AppName=Emendly
          AppVersion=$version
          DefaultDirName={localappdata}\Programs\Emendly
          DefaultGroupName=Emendly
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=dist
          OutputBaseFilename=Emendly-$tag-win-x64-setup
          SetupIconFile=stage\Emendly\Assets\emendly.ico
          UninstallDisplayIcon={app}\Emendly.App.exe
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes

          [Files]
          Source: "stage\Emendly\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{userprograms}\Emendly"; Filename: "{app}\Emendly.App.exe"

          [Run]
          Filename: "{app}\Emendly.App.exe"; Description: "{cm:LaunchProgram,Emendly}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path "installer.iss" -Value $iss -Encoding UTF8

          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          $iscc = if ($isccCmd) { $isccCmd.Source } else { Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

      - name: Sign Inno Setup installer
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $tag = "${{ github.ref_name }}"
          $target = "dist/Emendly-$tag-win-x64-setup.exe"

          $hasAzure = -not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ENDPOINT) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ACCOUNT) `
            -and -not [string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_PROFILE)
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_B64) `
            -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)

          if (-not $hasAzure -and -not $hasPfx) {
            Write-Host "::notice::No Windows code-signing secrets configured; shipping unsigned installer."
            exit 0
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found in Windows Kits"
          }

          if ($hasAzure) {
            $toolsDir = Join-Path $env:RUNNER_TEMP "trusted-signing-client"
            $dlib = Get-ChildItem $toolsDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $dlib) {
              New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
              $nupkg = Join-Path $toolsDir "client.zip"
              Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile $nupkg
              Expand-Archive -Path $nupkg -DestinationPath $toolsDir -Force
              $dlib = Get-ChildItem $toolsDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
                Where-Object { $_.FullName -match 'x64' } |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $dlib) {
              throw "Azure.CodeSigning.Dlib.dll not found in Microsoft.Trusted.Signing.Client package"
            }

            $metadataPath = Join-Path $env:RUNNER_TEMP "azure-signing-metadata.json"
            $metadata = @{
              Endpoint = $env:AZURE_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
              CertificateProfileName = $env:AZURE_SIGNING_PROFILE
            } | ConvertTo-Json
            Set-Content -Path $metadataPath -Value $metadata -Encoding UTF8

            try {
              & $signtool sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib /dmdf $metadataPath $target
              if ($LASTEXITCODE -ne 0) {
                throw "Azure Artifact Signing failed for $target (exit $LASTEXITCODE)"
              }
            }
            finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $metadataPath
            }
          }
          else {
            $pfxPath = Join-Path $env:RUNNER_TEMP "emendly-sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_B64))
            try {
              & $signtool sign /v /f $pfxPath /p $env:WINDOWS_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
              if ($LASTEXITCODE -ne 0) {
                throw "PFX code signing failed for $target (exit $LASTEXITCODE)"
              }
            }
            finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
            }
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist/Emendly-$tag-win-x64.zip",
            "dist/Emendly-$tag-win-x64-setup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name"
          }
          Set-Content -Path "dist/SHA256SUMS.txt" -Value $lines -Encoding ASCII
          Get-Content "dist/SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Emendly-${{ github.ref_name }}-win-x64.zip
            dist/Emendly-${{ github.ref_name }}-win-x64-setup.exe
            dist/SHA256SUMS.txt
