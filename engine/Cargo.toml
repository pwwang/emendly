[package]
name = "emendly-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local writing assistant engine speaking NDJSON over stdin/stdout"

[lib]
name = "emendly_engine"
path = "src/lib.rs"

[[bin]]
name = "emendly-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = "3"
